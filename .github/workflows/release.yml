name: Release

# Releases are SIGNED MANUALLY per project policy: the keystore never leaves
# the maintainer's machine, so CI must not (and cannot) produce release assets.
# Pushing a v* tag only opens the release shell with generated notes; attach
# the signed PcHwMonitor-vX.Y.apk and PcHwMonitor.exe afterwards by hand.
# See docs/RELEASING.md for the full procedure.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Open release shell with notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish GitHub release (no assets)
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true